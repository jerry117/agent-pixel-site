<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- sky backdrop -->
  <rect x="1" y="1" width="30" height="30" fill="#e8f0f8"/>
  <rect x="1" y="1" width="30" height="3" fill="#d5e3f0"/>
  <!-- house under construction -->
  <rect x="4" y="16" width="18" height="12" fill="#d9b382"/>
  <rect x="4" y="20" width="18" height="1" fill="#c49a66"/>
  <rect x="11" y="22" width="3" height="6" fill="#6e4a2c"/>
  <rect x="6" y="18" width="3" height="3" fill="#9fc4e8"/>
  <!-- roof rows -->
  <rect x="6" y="13" width="14" height="3" fill="#b5534c"/>
  <rect x="8" y="10" width="10" height="3" fill="#c96a5e"/>
  <!-- chimney + smoke -->
  <rect x="19" y="7" width="3" height="5" fill="#7a5a48"/>
  <rect x="20" y="3" width="3" height="2" fill="#b9c1cd"/>
  <rect x="23" y="1" width="2" height="2" fill="#cdd6de"/>
  <!-- worker with hard hat -->
  <rect x="24" y="16" width="6" height="2" fill="#f5c542"/>
  <rect x="23" y="18" width="8" height="1" fill="#d9a92f"/>
  <rect x="24" y="19" width="6" height="3" fill="#e8b48c"/>
  <rect x="25" y="20" width="1" height="1" fill="#3a2a1e"/>
  <rect x="28" y="20" width="1" height="1" fill="#3a2a1e"/>
  <rect x="24" y="22" width="6" height="5" fill="#4f74a8"/>
  <rect x="24" y="27" width="2" height="3" fill="#2f3b4a"/>
  <rect x="28" y="27" width="2" height="3" fill="#2f3b4a"/>
  <!-- ground -->
  <rect x="1" y="28" width="30" height="3" fill="#a06a3c"/>
  <rect x="1" y="28" width="30" height="1" fill="#7aa860"/>
</svg>
